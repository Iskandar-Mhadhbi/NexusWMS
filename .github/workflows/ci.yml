name: CI/CD

on:
  push:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: iskandar-mhadhbi

jobs:
  # ─────────────────────────────────────────────────────────────
  # TEST STAGE — runs on every push to develop or main
  # ─────────────────────────────────────────────────────────────

  backend-test:
    name: Backend — Checkstyle + JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # NOTE: checkstyle-maven-plugin configuration in pom.xml is unverified
      # as of this pipeline's authorship. If this step fails immediately
      # with a plugin-not-found or goal-not-found error, the plugin needs
      # to be added to pom.xml before this step can run — that is a
      # separate, required fix, not a pipeline bug.
      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: Run JUnit tests
        run: mvn -B test

      - name: Publish coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

  analytics-test:
    name: Analytics — ruff + Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      # NOTE: ruff configuration (pyproject.toml or .ruff.toml) is unverified
      # as of this pipeline's authorship. If this step fails with rule
      # violations rather than an installation error, that is real lint
      # feedback the codebase has not yet been checked against — expected,
      # not necessarily a pipeline defect.
      - name: ruff
        run: ruff check .

      - name: Run Pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=html

      - name: Publish coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-coverage-report
          path: analytics/htmlcov/
          retention-days: 14

  frontend-test:
    name: Frontend — ESLint + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # NOTE: an "lint" script in package.json and working ESLint config
      # are unverified as of this pipeline's authorship.
      - name: ESLint
        run: npm run lint

      - name: Run Vitest with coverage
        run: npx vitest run --coverage

      - name: Build (validates the app actually compiles)
        run: npm run build

      - name: Publish coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # BUILD STAGE — Docker images, pushed to GHCR on main only
  # ─────────────────────────────────────────────────────────────

  build-backend:
    name: Build Backend Image
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nexuswms/backend"
          echo "image-ref=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Save image as artifact for Trivy
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  build-analytics:
    name: Build Analytics Image
    needs: analytics-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nexuswms/analytics"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Save image as artifact for Trivy
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o analytics-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: analytics-image
          path: analytics-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # FRONTEND IMAGE — frontend/Dockerfile confirmed working, verified
  # via local docker-compose build/run (all six services healthy).
  # VITE_* build args are fixed values matching docker-compose.yml's
  # local defaults. These are baked into the compiled JS at build
  # time (Vite's own behavior) — if this image is ever deployed
  # anywhere other than this local-equivalent target, the image
  # must be rebuilt with different build args, not reconfigured
  # at runtime.
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    needs: frontend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nexuswms/frontend"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api/v1.0
            VITE_WS_BASE_URL=http://localhost:8080
            VITE_ANALYTICS_BASE_URL=http://localhost:8001/api/v1/analytics
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Save image as artifact for Trivy
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # SECURITY SCAN — Trivy against built images, main only
  # ─────────────────────────────────────────────────────────────

  trivy-scan:
    name: Trivy Vulnerability Scan
    if: github.ref == 'refs/heads/main'
    needs: [build-backend, build-analytics, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        target: [backend, analytics, frontend]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-image

      - name: Load image into Docker
        run: docker load -i ${{ matrix.target }}-image.tar

      - name: Determine image ref
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nexuswms/${{ matrix.target }}"
          echo "IMAGE_REF=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-${{ matrix.target }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.target }}.sarif'
          category: 'trivy-${{ matrix.target }}'