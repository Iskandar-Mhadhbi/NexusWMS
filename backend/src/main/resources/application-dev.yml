spring:
  mvc:
      apiversion:
        use:
          path-segment: 1
        supported: 1.0
        enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/nexuswms
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false  
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true 

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mongodb:
   uri: mongodb://admin:password@localhost:27017/nexuswms?authSource=admin  

  data:
    redis:
      host: localhost
      port: 6379

  security: 
    oauth2: 
      client:
        registration: 
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
  
logging:
  level:
    '[com.nexuswms]': DEBUG
    '[org.springframework.security]': DEBUG
    '[org.springframework.web]': DEBUG
    
app:
  jwt:
    secret: dev-secret-key-6484ed4fd8s4eOHD6ZDdcvxdsfdsqs
    expiration-ms: 604800000     