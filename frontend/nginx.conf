server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path not matching a real static file falls through
    # to index.html so vue-router can handle it client-side (e.g. a hard
    # refresh on /terminal/pick shouldn't 404 at the nginx layer).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching — Vite fingerprints filenames
    # (e.g. index-a1b2c3.js) on every build, so a new deploy naturally
    # busts the cache via a new filename rather than needing cache
    # invalidation logic here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's the one file whose
    # content changes without its filename changing (it references the
    # fingerprinted asset names above).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}